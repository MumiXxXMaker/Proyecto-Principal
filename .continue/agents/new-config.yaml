name: Proyecto Automatizado
version: 1.0.0
schema: v1

rules:
  - "Escribe código modular, tipado cuando aplique y con manejo explícito de errores."
  - "No modifiques archivos fuera del alcance de la tarea sin indicarlo primero."

prompts:
  - name: plan-feature
    description: Planifica una tarea o feature antes de implementarla
    prompt: |
      Analiza la tarea: {{{ input }}}.
      Lista los pasos de ejecución, archivos afectados, riesgos y criterios de validación.
  - name: review-diff
    description: Revisa cambios pendientes en busca de bugs y riesgos
    prompt: |
      Revisa @diff y reporta bugs, problemas de seguridad o regresiones con su solución propuesta.
