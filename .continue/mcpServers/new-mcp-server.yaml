name: Mac Ollama + Zsh MCP
version: 1.0.0
schema: v1

models:
  - name: Qwen 2.5 Coder (Ollama)
    provider: ollama
    model: qwen2.5-coder:7b
    apiBase: http://localhost:11434
    capabilities:
      - tool_use
    defaultCompletionOptions:
      contextLength: 16384

mcpServers:
  - name: Mac Terminal
    command: /Users/raimundolarrain/mcp-servers/.venv/bin/python
    args:
      - "/Users/raimundolarrain/mcp-servers/shell_mcp_server.py"
    command: npx
    args:
      - -y
      - <your-mcp-server>
    env: {}
